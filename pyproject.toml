[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "photoheaven"
version = "0.1.0"
description = "Python CLI for organizing, analysing, and face-clustering local photo and video collections."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Francisco", email = "your.email@example.com" },
]
keywords = ["photos", "videos", "exif", "faces", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Video",
]

dependencies = [
    # CLI / UX
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.0",

    # Persistence
    "sqlalchemy>=2.0",

    # Integrity / duplication
    "blake3>=0.4",
    "imagehash>=4.3",

    # Image metadata (EXIF, HEIC, AVIF)
    "pillow>=10.0",
    "pillow-heif>=0.16",
    "pillow-avif-plugin>=1.3",

    # Video/container metadata (requires the MediaInfo binary to be installed)
    "pymediainfo>=6.0",

    # Face detection / recognition
    "insightface>=0.7",
    "onnxruntime>=1.17",
    "opencv-python-headless>=4.8",

    # Clustering / numeric helpers
    "scikit-learn>=1.4",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
photoheaven = "photoheaven.cli.main:app"
ph = "photoheaven.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/photoheaven"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
